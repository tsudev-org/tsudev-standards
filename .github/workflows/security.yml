name: Quét bảo mật

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 08:00 giờ Việt Nam thứ Hai hằng tuần - quét lại toàn repo, không chỉ khi có PR
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Quét secret (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Binary ghim phiên bản + checksum, KHÔNG dùng gitleaks-action: action đó đòi
      # GITLEAKS_LICENSE khi repo thuộc Organization (đỏ ngay sau khi chuyển sang
      # tsudev-org 09/11/2026). Nâng phiên bản: đổi CẢ HAI dòng, checksum lấy từ
      # gitleaks_<ver>_checksums.txt của bản phát hành tương ứng.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Lấy mã nguồn kèm toàn bộ lịch sử
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tải gitleaks (ghim phiên bản, kiểm checksum)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # --log-opts=HEAD: chỉ quét lịch sử đi tới được từ commit đang kiểm.
      # --redact: log CI là công khai - không in lại secret vừa bắt.
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 \
            --log-opts=HEAD \
            .

  codeql:
    name: Phân tích tĩnh (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Khởi tạo CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Phân tích
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:${{ matrix.language }}
